name: whatsapp-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: whatsapp
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Execute o configurador}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    logging: {options: {max-size: "10m", max-file: "3"}}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Execute o configurador}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]
    logging: {options: {max-size: "10m", max-file: "3"}}

  evolution:
    image: whatsapp-central/evolution-local:2.3.7
    build:
      context: .
      dockerfile: Dockerfile.evolution
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports:
      - "127.0.0.1:8767:8080"
    environment:
      SERVER_URL: http://127.0.0.1:8767
      SERVER_PORT: "8080"
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY:?Execute o configurador}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "false"
      DEL_INSTANCE: "false"
      DEL_TEMP_INSTANCES: "false"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://whatsapp:${POSTGRES_PASSWORD}@postgres:5432/whatsapp
      DATABASE_CONNECTION_CLIENT_NAME: whatsapp_local
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://default:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: whatsapp_local
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      SQS_ENABLED: "false"
      S3_ENABLED: "false"
      TYPEBOT_ENABLED: "false"
      CHATWOOT_ENABLED: "false"
      OPENAI_ENABLED: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN,INFO
      QRCODE_LIMIT: "60"
      NODE_EXTRA_CA_CERTS: /evolution/certs/windows-ca.pem
    volumes:
      - instances:/evolution/instances
      - ../data/certs:/evolution/certs:ro
    networks: [internal, edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 30s
    logging: {options: {max-size: "10m", max-file: "3"}}

volumes:
  postgres_data:
  redis_data:
  instances:
networks:
  internal: {internal: true}
  edge:
